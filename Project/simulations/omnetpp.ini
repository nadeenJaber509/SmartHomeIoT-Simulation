[General]

network = smarthomeiot.simulations.smarthome.SmartHomeNetwork
sim-time-limit = 100s

**.arp.typename = "GlobalArp"
**.netmaskRoutes = ""

*.radioMedium.backgroundNoise.power = -110dBm

# =========================================================
# NETWORK CONFIGURATION
# =========================================================

*.configurator.config = xmldoc("startopology.xml")
*.configurator.addStaticRoutes = false


# =========================================================
# IEEE 802.15.4
# =========================================================

# SensorNode already uses IEEE 802.15.4 narrowband defaults,
# so keep these commented out.

# **.wlan[*].typename = "Ieee802154NarrowbandInterface"
# **.wlan[*].radio.typename = "Ieee802154NarrowbandRadio"
# **.wlan[*].mac.typename = "Ieee802154NarrowbandMac"


# =========================================================
# PHYSICAL NODE POSITIONS
# These are the real wireless distances in meters.
# The larger positions in SmartHomeNetwork.ned are only for
# making the GUI look nice.
# =========================================================

**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false
**.mobility.updateDisplayString = false

*.temperatureSensor.mobility.initialX = 3m
*.temperatureSensor.mobility.initialY = 4m

*.humiditySensor.mobility.initialX = 7m
*.humiditySensor.mobility.initialY = 4m

*.motionSensor1.mobility.initialX = 11m
*.motionSensor1.mobility.initialY = 4m

*.motionSensor2.mobility.initialX = 15m
*.motionSensor2.mobility.initialY = 4m

*.smokeSensor.mobility.initialX = 17m
*.smokeSensor.mobility.initialY = 7m

*.airQualitySensor.mobility.initialX = 4m
*.airQualitySensor.mobility.initialY = 10m

*.doorSensor.mobility.initialX = 8m
*.doorSensor.mobility.initialY = 10m

*.lightSensor.mobility.initialX = 12m
*.lightSensor.mobility.initialY = 10m

*.lightActuator1.mobility.initialX = 3m
*.lightActuator1.mobility.initialY = 16m

*.lightActuator2.mobility.initialX = 7m
*.lightActuator2.mobility.initialY = 16m

*.hvacActuator.mobility.initialX = 11m
*.hvacActuator.mobility.initialY = 16m

*.alarmActuator.mobility.initialX = 15m
*.alarmActuator.mobility.initialY = 16m

*.gateway.mobility.initialX = 10m
*.gateway.mobility.initialY = 8m


# =========================================================
# PERIODIC SENSOR TRAFFIC
# Baseline: 50-byte payload every 10 seconds
# =========================================================

*.temperatureSensor.numApps = 1
*.temperatureSensor.app[0].typename = "UdpBasicApp"
*.temperatureSensor.app[0].destAddresses = "gateway"
*.temperatureSensor.app[0].destPort = 1000
*.temperatureSensor.app[0].sendInterval = 10s
*.temperatureSensor.app[0].startTime = uniform(0s,1s)
*.temperatureSensor.app[0].messageLength = 50B
*.temperatureSensor.app[0].packetName = "TemperatureData"

*.humiditySensor.numApps = 1
*.humiditySensor.app[0].typename = "UdpBasicApp"
*.humiditySensor.app[0].destAddresses = "gateway"
*.humiditySensor.app[0].destPort = 1000
*.humiditySensor.app[0].sendInterval = 10s
*.humiditySensor.app[0].startTime = uniform(0s,1s)
*.humiditySensor.app[0].messageLength = 50B
*.humiditySensor.app[0].packetName = "HumidityData"

*.motionSensor1.numApps = 1
*.motionSensor1.app[0].typename = "UdpBasicApp"
*.motionSensor1.app[0].destAddresses = "gateway"
*.motionSensor1.app[0].destPort = 1000
*.motionSensor1.app[0].sendInterval = 10s
*.motionSensor1.app[0].startTime = uniform(0s,1s)
*.motionSensor1.app[0].messageLength = 50B
*.motionSensor1.app[0].packetName = "MotionData1"

*.motionSensor2.numApps = 1
*.motionSensor2.app[0].typename = "UdpBasicApp"
*.motionSensor2.app[0].destAddresses = "gateway"
*.motionSensor2.app[0].destPort = 1000
*.motionSensor2.app[0].sendInterval = 10s
*.motionSensor2.app[0].startTime = uniform(0s,1s)
*.motionSensor2.app[0].messageLength = 50B
*.motionSensor2.app[0].packetName = "MotionData2"

*.airQualitySensor.numApps = 1
*.airQualitySensor.app[0].typename = "UdpBasicApp"
*.airQualitySensor.app[0].destAddresses = "gateway"
*.airQualitySensor.app[0].destPort = 1000
*.airQualitySensor.app[0].sendInterval = 10s
*.airQualitySensor.app[0].startTime = uniform(0s,1s)
*.airQualitySensor.app[0].messageLength = 50B
*.airQualitySensor.app[0].packetName = "AirQualityData"

*.doorSensor.numApps = 1
*.doorSensor.app[0].typename = "UdpBasicApp"
*.doorSensor.app[0].destAddresses = "gateway"
*.doorSensor.app[0].destPort = 1000
*.doorSensor.app[0].sendInterval = 10s
*.doorSensor.app[0].startTime = uniform(0s,1s)
*.doorSensor.app[0].messageLength = 50B
*.doorSensor.app[0].packetName = "DoorData"

*.lightSensor.numApps = 1
*.lightSensor.app[0].typename = "UdpBasicApp"
*.lightSensor.app[0].destAddresses = "gateway"
*.lightSensor.app[0].destPort = 1000
*.lightSensor.app[0].sendInterval = 10s
*.lightSensor.app[0].startTime = uniform(0s,1s)
*.lightSensor.app[0].messageLength = 50B
*.lightSensor.app[0].packetName = "LightData"


# =========================================================
# CRITICAL / EVENT-DRIVEN TRAFFIC
# One smoke event at 30 seconds
# =========================================================

*.smokeSensor.numApps = 1
*.smokeSensor.app[0].typename = "UdpBasicApp"
*.smokeSensor.app[0].destAddresses = "gateway"
*.smokeSensor.app[0].destPort = 1001
*.smokeSensor.app[0].sendInterval = 1000s
*.smokeSensor.app[0].startTime = 30s
*.smokeSensor.app[0].messageLength = 50B
*.smokeSensor.app[0].packetName = "CriticalSmokeAlarm"


# =========================================================
# GATEWAY
# =========================================================

*.gateway.numApps = 2

*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 1000

*.gateway.app[1].typename = "UdpSink"
*.gateway.app[1].localPort = 1001


# =========================================================
# ACTUATORS
# No application traffic yet
# =========================================================

*.lightActuator1.numApps = 0
*.lightActuator2.numApps = 0
*.hvacActuator.numApps = 0
*.alarmActuator.numApps = 0


# =========================================================
# VISUALIZATION
# =========================================================

*.visualizer.routingTableVisualizer[0].displayRoutingTables = false
*.visualizer.interfaceTableVisualizer[0].displayInterfaceTables = false

*.visualizer.numDataLinkVisualizers = 1
*.visualizer.dataLinkVisualizer[0].displayLinks = true
*.visualizer.dataLinkVisualizer[0].nodeFilter = "*"

*.visualizer.numStatisticVisualizers = 2

*.visualizer.statisticVisualizer[0].displayStatistics = true
*.visualizer.statisticVisualizer[0].signalName = "packetSent"
*.visualizer.statisticVisualizer[0].statisticExpression = "count"
*.visualizer.statisticVisualizer[0].format = "sent: %v pks"

*.visualizer.statisticVisualizer[1].displayStatistics = true
*.visualizer.statisticVisualizer[1].signalName = "packetReceived"
*.visualizer.statisticVisualizer[1].statisticExpression = "count"
*.visualizer.statisticVisualizer[1].format = "rcvd: %v pks"
# =========================================================
# EXPERIMENT 1 - NETWORK SCALABILITY
# =========================================================

[Config Scalability]

network = smarthomeiot.simulations.smarthome.ScalabilityNetwork
sim-time-limit = 100s

# Number of active sensor nodes
*.numSensors = ${N=5,10,20,30,40}

repeat = 5
seed-set = ${repetition}

# ---------------------------------------------------------
# Network configuration
# ---------------------------------------------------------

**.arp.typename = "GlobalArp"
**.netmaskRoutes = ""

*.radioMedium.backgroundNoise.power = -110dBm

# Automatically configure IP addresses and routes
*.configurator.addStaticRoutes = true

# ---------------------------------------------------------
# Physical wireless positions
# ---------------------------------------------------------

**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false
**.mobility.updateDisplayString = false

# Put all sensors inside the smart-home wireless area
*.sensor[*].mobility.initialX = uniform(2m,18m)
*.sensor[*].mobility.initialY = uniform(2m,18m)

# Gateway near the center
*.gateway.mobility.initialX = 10m
*.gateway.mobility.initialY = 10m

# ---------------------------------------------------------
# Periodic monitoring traffic
# Fixed for Experiment 1:
# Packet size = 50 B
# Reporting interval = 10 s
# ---------------------------------------------------------

*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "UdpBasicApp"
*.sensor[*].app[0].destAddresses = "gateway"
*.sensor[*].app[0].destPort = 1000

*.sensor[*].app[0].sendInterval = 10s
*.sensor[*].app[0].startTime = uniform(0s,1s)
*.sensor[*].app[0].messageLength = 50B
*.sensor[*].app[0].packetName = "SensorData"

# ---------------------------------------------------------
# Gateway
# ---------------------------------------------------------

*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 1000

# ---------------------------------------------------------
# Visualization
# ---------------------------------------------------------

*.visualizer.routingTableVisualizer[0].displayRoutingTables = false
*.visualizer.interfaceTableVisualizer[0].displayInterfaceTables = false

*.visualizer.numDataLinkVisualizers = 1
*.visualizer.dataLinkVisualizer[0].displayLinks = true
*.visualizer.dataLinkVisualizer[0].nodeFilter = "*"

*.visualizer.numStatisticVisualizers = 2

*.visualizer.statisticVisualizer[0].displayStatistics = true
*.visualizer.statisticVisualizer[0].signalName = "packetSent"
*.visualizer.statisticVisualizer[0].statisticExpression = "count"
*.visualizer.statisticVisualizer[0].format = "sent: %v pks"

*.visualizer.statisticVisualizer[1].displayStatistics = true
*.visualizer.statisticVisualizer[1].signalName = "packetReceived"
*.visualizer.statisticVisualizer[1].statisticExpression = "count"
*.visualizer.statisticVisualizer[1].format = "rcvd: %v pks"

# =========================================================
# EXPERIMENT 1 - RESULT RECORDING
# =========================================================

# Save scalar and vector results
**.scalar-recording = true
**.vector-recording = true

# Record application packet statistics
**.packetSent:count.scalar-recording = true
**.packetReceived:count.scalar-recording = true

# Record end-to-end delay
**.endToEndDelay:vector.vector-recording = true
**.endToEndDelay:mean.scalar-recording = true

# Record throughput
**.throughput:vector.vector-recording = true

# =========================================================
# EXPERIMENT 2 - REPORTING INTERVAL AND LATENCY TRADE-OFF
# =========================================================

[Config ReportingInterval]
extends = Scalability

constraint = $N == 5

*.numSensors = 12

*.sensor[*].app[0].sendInterval = ${T=1s,5s,10s,30s,60s}

repeat = 5
seed-set = ${repetition}

# =========================================================
# EXPERIMENT 3 - CRITICAL EVENT UNDER BACKGROUND TRAFFIC
# =========================================================

[Config CriticalEvent]
network = smarthomeiot.simulations.smarthome.SmartHomeNetwork
sim-time-limit = 100s

# Four background-load levels, 30 independent repetitions each
repeat = 30
seed-set = ${repetition}

# Background traffic: seven ordinary sensors
*.temperatureSensor.app[0].sendInterval = ${Tbg=10s,1s,0.1s,0.02s}
*.humiditySensor.app[0].sendInterval = ${Tbg}
*.motionSensor1.app[0].sendInterval = ${Tbg}
*.motionSensor2.app[0].sendInterval = ${Tbg}
*.airQualitySensor.app[0].sendInterval = ${Tbg}
*.doorSensor.app[0].sendInterval = ${Tbg}
*.lightSensor.app[0].sendInterval = ${Tbg}

# One critical alarm per run
*.smokeSensor.app[0].startTime = 30s
*.smokeSensor.app[0].sendInterval = 1000s
*.smokeSensor.app[0].messageLength = 50B
*.smokeSensor.app[0].destPort = 1001
*.smokeSensor.app[0].packetName = "CriticalSmokeAlarm"

# Separate receiver for critical alarms
*.gateway.numApps = 2
*.gateway.app[1].typename = "UdpSink"
*.gateway.app[1].localPort = 1001

# Keep Experiment 3 results in a separate folder
result-dir = results/Experiment3

# Scalar results for packet counts and delay distributions
**.scalar-recording = true

# Record delay samples only for the alarm receiver
*.gateway.app[1].endToEndDelay:vector.vector-recording = true
**.vector-recording = false

# =========================================================
# EXPERIMENT 4 - APPLICATION COMMUNICATION STRATEGY
# =========================================================

[Config CommunicationBase]
network = smarthomeiot.simulations.smarthome.CommunicationStrategiesNetwork

sim-time-limit = 100s
repeat = 1
seed-set = ${repetition}

# Network addressing
*.configurator.config = xmldoc("communicationtopology.xml")

# Controller position
*.controller.mobility.initialX = 14m
*.controller.mobility.initialY = 8m

# ---------------------------------------------------------
# Background traffic from seven ordinary sensors
# 10s: light load
# 0.02s: heavy load
# Payload remains 50 bytes, inherited from General
# ---------------------------------------------------------

*.temperatureSensor.app[0].sendInterval = ${Tbg=10s,0.02s}
*.humiditySensor.app[0].sendInterval = ${Tbg}
*.motionSensor1.app[0].sendInterval = ${Tbg}
*.motionSensor2.app[0].sendInterval = ${Tbg}
*.airQualitySensor.app[0].sendInterval = ${Tbg}
*.doorSensor.app[0].sendInterval = ${Tbg}
*.lightSensor.app[0].sendInterval = ${Tbg}

# ---------------------------------------------------------
# Controller
# ---------------------------------------------------------

*.controller.numApps = 1
*.controller.app[0].typename = "smarthomeiot.simulations.smarthome.CommunicationApp"
*.controller.app[0].role = "controller"
*.controller.app[0].localPort = 2000
*.controller.app[0].destinationPort = 2000
*.controller.app[0].startTime = 1s
*.controller.app[0].stopTime = 100s
*.controller.app[0].pollingInterval = 5s

# ---------------------------------------------------------
# Smoke sensor: one persistent event at 30 seconds
# ---------------------------------------------------------

*.smokeSensor.numApps = 1
*.smokeSensor.app[0].typename = "smarthomeiot.simulations.smarthome.CommunicationApp"
*.smokeSensor.app[0].role = "sensor"
*.smokeSensor.app[0].localPort = 2000
*.smokeSensor.app[0].destinationPort = 2000
*.smokeSensor.app[0].eventTime = 30s
*.smokeSensor.app[0].stopTime = 100s

# ---------------------------------------------------------
# Gateway
# app[0]: ordinary background traffic
# app[1]: polling relay or publish/subscribe broker
# ---------------------------------------------------------

*.gateway.numApps = 2

*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 1000

*.gateway.app[1].typename = "smarthomeiot.simulations.smarthome.CommunicationApp"
*.gateway.app[1].role = "gateway"
*.gateway.app[1].localPort = 2000
*.gateway.app[1].destinationPort = 2000
*.gateway.app[1].stopTime = 100s

# ---------------------------------------------------------
# Application message sizes
# Abstract behavior over UDP, not full CoAP/MQTT protocols
# ---------------------------------------------------------

*.controller.app[0].requestBytes = 20
*.controller.app[0].readingBytes = 50

*.smokeSensor.app[0].requestBytes = 20
*.smokeSensor.app[0].readingBytes = 50

*.gateway.app[1].requestBytes = 20
*.gateway.app[1].readingBytes = 50

# ---------------------------------------------------------
# Results: scalar recording only
# Separate folder from the initial test runs
# ---------------------------------------------------------

result-dir = results/Experiment4/Comparison
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca

**.scalar-recording = true
**.vector-recording = false
record-eventlog = false


# =========================================================
# A - REQUEST / RESPONSE
# 3 polling intervals x 2 loads x 5 seeds = 30 runs
# =========================================================

[Config Polling]
extends = CommunicationBase

*.controller.app[0].strategy = "polling"
*.gateway.app[1].strategy = "polling"
*.smokeSensor.app[0].strategy = "polling"

*.controller.app[0].pollingInterval = ${Tpoll=1s,5s,10s}


# =========================================================
# B - PUBLISH / SUBSCRIBE
# 2 loads x 5 seeds = 10 runs
# =========================================================

[Config PubSub]
extends = CommunicationBase

*.controller.app[0].strategy = "pubsub"
*.gateway.app[1].strategy = "pubsub"
*.smokeSensor.app[0].strategy = "pubsub"

# =========================================================
# EXPERIMENT 5 - PACKET SIZE / FRAGMENTATION
# 5 payload sizes x 5 seeds = 25 runs
# =========================================================

[Config PacketSize]
extends = CommunicationBase
constraint = $Tbg == 10s
# Use the polling strategy
*.controller.app[0].strategy = "polling"
*.gateway.app[1].strategy = "polling"
*.smokeSensor.app[0].strategy = "polling"

# Keep polling interval fixed
*.controller.app[0].pollingInterval = 1s
# Keep background traffic fixed at the normal load
*.temperatureSensor.app[0].sendInterval = 10s
*.humiditySensor.app[0].sendInterval = 10s
*.motionSensor1.app[0].sendInterval = 10s
*.motionSensor2.app[0].sendInterval = 10s
*.airQualitySensor.app[0].sendInterval = 10s
*.doorSensor.app[0].sendInterval = 10s
*.lightSensor.app[0].sendInterval = 10s

# Change only the READING payload size
*.controller.app[0].readingBytes = ${Payload=20,50,100,200,400}
*.gateway.app[1].readingBytes = ${Payload}
*.smokeSensor.app[0].readingBytes = ${Payload}

# Five independent repetitions
repeat = 5
seed-set = ${repetition}

# Store Experiment 5 results separately
output-scalar-file = "results/Experiment5/PacketSize-Payload=${Payload}B-run${repetition}.sca"
output-vector-file = "results/Experiment5/PacketSize-Payload=${Payload}B-run${repetition}.vec"
# Record results
**.scalar-recording = true
**.vector-recording = true

# =========================================================
# BONUS - OBSTACLES / WALLS
# Two cases x five seeds = 10 runs
# =========================================================

[Config BonusNoWalls]
extends = CommunicationBase

constraint = $Tbg == 10s

*.controller.app[0].strategy = "polling"
*.gateway.app[1].strategy = "polling"
*.smokeSensor.app[0].strategy = "polling"

*.controller.app[0].pollingInterval = 1s

repeat = 5
seed-set = ${repetition}

output-scalar-file = "results/BonusWalls/NoWalls-run${repetition}.sca"
output-vector-file = "results/BonusWalls/NoWalls-run${repetition}.vec"

**.scalar-recording = true
**.vector-recording = true


[Config BonusWithWalls]
extends = BonusNoWalls

*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = -10m
*.physicalEnvironment.spaceMaxX = 25m
*.physicalEnvironment.spaceMaxY = 20m
*.physicalEnvironment.spaceMaxZ = 10m

*.physicalEnvironment.config = xmldoc("walls.xml")
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

output-scalar-file = "results/BonusWalls/WithWalls-run${repetition}.sca"
output-vector-file = "results/BonusWalls/WithWalls-run${repetition}.vec"